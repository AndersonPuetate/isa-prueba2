name: Deploy Docker App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t isa-webapp:${{ github.sha }} .

      - name: Guardar imagen como archivo tar.gz
        run: |
          docker save isa-webapp:${{ github.sha }} | gzip > isa-webapp.tar.gz

      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar imagen a EC2
        run: |
          scp -i ~/.ssh/ec2_key isa-webapp.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/isa-webapp.tar.gz

      - name: Desplegar contenedor en EC2
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            sudo docker load < /tmp/isa-webapp.tar.gz
            sudo docker rm -f isa-webapp || true
            sudo docker run -d \
              --name isa-webapp \
              --restart unless-stopped \
              -p 80:80 \
              isa-webapp:${{ github.sha }}
            sudo docker ps --filter "name=isa-webapp"
          EOF
